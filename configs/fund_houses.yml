# fund_houses.yml — which participant names belong to which fund house (Plan 3
# step 3.12, owner decision Q21: a MANUAL mapping file, not inference).
#
# WHAT IT IS FOR. `participants.yml` counts SBI Mutual Fund's scheme accounts
# as separate institutions under the primary consensus definition, and runs
# the parent-grouped variant as robustness: "the gap between the two measures
# how much 'consensus' is really one house". This file is that grouping.
#
# HOW IT IS READ. src/identity/participants.py matches each pattern against a
# participant's CLEANED name (entity_names.normalize: upper case, punctuation
# and corporate suffixes stripped). A participant gets the FIRST group whose
# pattern matches; order matters only where two could. A name no group
# matches has no parent — never a guessed one.
#
# GROUPS ARE FUND HOUSES (the AMC), NOT CONGLOMERATES. SBI Mutual Fund and SBI
# Life Insurance are different institutions with different mandates, and a
# conglomerate grouping would be a different robustness question.
#
# RENAMES ARE MARKED `renamed:` AND NEED THE OWNER'S CONFIRMATION. The same
# AMC under an old and a new name is one house (Reliance MF became Nippon
# India MF in 2019 when Nippon Life took control). A MERGER of two houses is
# NOT a rename: L&T MF's schemes moved to HSBC MF in 2022, and before that
# they were a different house's decisions, so they stay separate.
#
# Seeded 2026-10-02 from the 30 largest fund-house names in the deal corpus by
# rupee value.
#
# CONFIRMED BY THE OWNER 2026-10-02: every `renamed:` group below is one
# continuous AMC (sponsor change, stake sale, JV exit or rebrand; scheme
# codes and registration carried over). STILL OPEN: BARODA_BNP_AMC — whether
# Baroda MF and BNP Paribas MF before their 2022 merger are one house.

status: confirmed
open_questions: [BARODA_BNP_AMC]

groups:
  SBI_FUNDS:
    name: SBI Funds Management
    pattern: '^SBI MUTUAL FUND|^SBI MF\b|SBI FUNDS MANAGEMENT'
  ICICI_PRUDENTIAL_AMC:
    name: ICICI Prudential Asset Management
    pattern: 'ICICI PRUDENTIAL (MUTUAL FUND|MF\b|ASSET)|^PRUDENTIAL ICICI'
    renamed: 'Prudential ICICI Mutual Fund (until 2005) -> ICICI Prudential Mutual Fund'
  HDFC_AMC:
    name: HDFC Asset Management
    pattern: '^HDFC MUTUAL FUND|^HDFC MF\b|HDFC ASSET MANAGEMENT'
  KOTAK_AMC:
    name: Kotak Mahindra Asset Management
    pattern: 'KOTAK MAHINDRA (MUTUAL FUND|ASSET)|^KOTAK MUTUAL FUND|^KOTAK MF\b'
  NIPPON_INDIA_AMC:
    name: Nippon Life India Asset Management
    pattern: '^NIPPON (LIFE )?INDIA (MUTUAL FUND|MF\b|ASSET)|^RELIA?L?NCE (CAPITAL )?(MUTUAL FUND|CAPITAL ASSET|NIPPON LIFE ASSET)'
    renamed: 'Reliance Mutual Fund -> Reliance Nippon Life -> Nippon India Mutual Fund (2019)'
  ADITYA_BIRLA_SL_AMC:
    name: Aditya Birla Sun Life AMC
    pattern: '(ADITYA )?BIRLA SUN ?LIFE (MUTUAL FUND|ASSET|TRUSTEE)|^ABSL MUTUAL FUND|^BIRLA MUTUAL FUND'
    renamed: 'Birla Sun Life Mutual Fund -> Aditya Birla Sun Life Mutual Fund (2017)'
  AXIS_AMC:
    name: Axis Asset Management
    pattern: '^AXIS MUTUAL FUND|^AXIS MF\b|AXIS ASSET MANAGEMENT'
  UTI_AMC:
