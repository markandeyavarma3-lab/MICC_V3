    pattern: '^DSP (BLACKROCK |BLACK ROCK |MERR?ILL LYNCH )?(MUTUAL FUND|MF\b|INVESTMENT MANAGERS)'
    renamed: 'DSP Merrill Lynch MF -> DSP BlackRock MF (2008) -> DSP Mutual Fund (2018, BlackRock exit)'
  MOTILAL_OSWAL_AMC:
    name: Motilal Oswal Asset Management
