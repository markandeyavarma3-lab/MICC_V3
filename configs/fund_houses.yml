  FRANKLIN_TEMPLETON_AMC:
    name: Franklin Templeton Asset Management (India)
    pattern: '^FRANKLIN TEMPLETON (MUTUAL FUND|ASSET|INDIA)|^TEMPLETON MUTUAL FUND'
    renamed: 'Templeton Mutual Fund -> Franklin Templeton Mutual Fund'
  TATA_AMC:
    name: Tata Asset Management
    pattern: '^TATA MUTUAL FUND|^TATA MF\b|TATA ASSET MANAGEMENT'
  HSBC_AMC:
    name: HSBC Asset Management (India)
    pattern: '^HSBC (MUTUAL FUND|MF\b|ASSET MANAGEMENT)'
  LNT_AMC:
    name: L&T Investment Management (merged into HSBC MF 2022 — kept separate)
    pattern: '^L ?(&|AND)? ?T MUTUAL FUND|^L AND T MUTUAL FUND|^LT MUTUAL FUND'
  INVESCO_AMC:
    name: Invesco Asset Management (India)
