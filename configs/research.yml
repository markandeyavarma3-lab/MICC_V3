# research.yml — horizons, power, walk-forward, corrections (Plan 2 §3, §6).

# HORIZONS — REVISED 2026-08-16 after Finding 001.
#
# The original grid started at 1 month. The only real effect found all day was at
# 10 SESSIONS, and the grid would have missed it entirely. The power arithmetic
# says why: monthly cohorts give 247 observations and MDE 1.52%; daily cohorts
# give ~3,345 and MDE 0.163% — a 9x improvement. The plan was pointed at the
# frequency where MDE exceeds any plausible effect.
horizons_sessions: [1, 2, 3, 5, 10, 21]     # PRIMARY — where the power is
headline_horizons_sessions: [1, 3, 5, 10]
horizons_months: [3, 6, 12]                  # ROBUSTNESS only, not where we look
# The 8/10/15/18/24-month horizons are dropped: MDE at 12m is already 7.38%
# against a plausible bound of 0.50%, so longer is strictly more hopeless and
# each one spends correction budget for a guaranteed UNDERPOWERED row.

timing:
  entry: next_session_open         # strictly after available_from
  no_same_day_close: true          # unless publication before close is PROVEN
  horizon_unit: trading_sessions   # never calendar-day arithmetic

delisting:
  # OWNER DECISION: report all three recovery factors, headline at 0.0.
  # 6,574 of 30,771 events hit this, so the assumption is load-bearing and a
  # single number would hide it.
  headline_recovery_factor: 0.0
  sensitivity_recovery_factors: [0.25, 0.50]
  merger_treatment: roll_into_acquirer_at_exchange_ratio
  suspension_treatment: mark_at_last_price_and_flag_excluded

excursions:
  # OWNER DECISION: intraday primary, close reported alongside. Intraday is the
  # true worst tick and what a stop would have hit; understating drawdown is the
  # more dangerous error.
  primary_basis: intraday
  also_report: close
  both_always_populated: true

power:
  # MEASURED 2026-08-16, not assumed. MDE = minimum detectable effect at 80%
  # power on the monthly-cohort mean, two-sided alpha 0.05.
  #
  #   study            1m      3m      12m
  #   bulk buys       1.52%   3.07%   7.38%   (observed: -0.12%, -0.22%, +7.80%)
  #   bulk sells      1.57%   3.12%   7.58%
  #   block deals     2.07%   3.81%  11.50%
  #
  # The 12-month "+7.80% signal" sits ON its own 7.38% detection floor. That is
  # noise at the boundary, not weak evidence.
  #
  # THE UNCOMFORTABLE PART: a realistic institutional edge is 0.3-0.5%/month.
  # Even after characteristic matching (MDE 1.05%) these studies can only detect
  # implausibly large effects. Stated here so it cannot read as a late surprise.
  alpha: 0.05
  target_power: 0.80
  plausible_effect_bound_monthly: 0.005    # 0.5%/month = 6%/yr abnormal
  # If MDE > plausible bound, the verdict is UNDERPOWERED — silence, not a
  # negative — regardless of the p-value.
  underpowered_rule: mde_exceeds_plausible_bound
  estimator: monthly_cohort_mean
  bootstrap_draws: 10000
  block_length_rule: at_least_horizon

walk_forward:
  # Three schemes, all reported. A result that passes anchored but fails CPCV's
  # PBO test is a result that got lucky in one ordering of time.
  anchored:
    train_start: "2005-01-01"
    test_starts: [2010, 2012, 2014, 2016, 2018, 2020]
    test_years: 5
  rolling:
    train_years: 8
    test_years: 3
    step_years: 1
  cpcv:
    # N MUST vary with the horizon. A fixed N=12 gives 20.6-month groups over the
    # 20.6-year deal span, and purging a 24-month label then consumes MORE THAN
    # AN ENTIRE ADJACENT GROUP. Group length must be >= ~2x the label horizon.
    k_test_groups: 2
    embargo_months: 1
    n_groups_by_horizon:
      - { max_horizon_months: 3,  n: 20, paths: 190 }
      - { max_horizon_months: 6,  n: 16, paths: 120 }
      - { max_horizon_months: 12, n: 10, paths: 45 }
      - { max_horizon_months: 24, n: 6,  paths: 15 }
    low_confidence_below_paths: 20   # 24m PBO carries an explicit marker
  pbo:
    formulation: cscv_logit_lambda   # Lopez de Prado; not a plain rank count
    fail_threshold: 0.5              # PBO > 0.5 => selection worse than random

corrections:
  # Romano-Wolf is the upgrade over the predecessor, which had NOTHING for
  # participant ranking. Hansen SPA replaces White's Reality Check as the
  # decision rule but RC is retained for direct comparability.
  participant_ranking: romano_wolf
  seasonality_primary: benjamini_yekutieli
  seasonality_also: [benjamini_hochberg, storey_q]
  best_of_family: hansen_spa
  best_of_family_also: [whites_reality_check]
  spa_variants_reported: [SPA_l, SPA_c, SPA_u]
  spa_decision_rule: SPA_c
  bootstrap_draws: 10000
  resample_unit: whole_months        # preserves cross-sectional + serial dependence

participant_eligibility:
  min_matured_events: 30             # reduces 27,417 names to a few hundred
  # The null-calibration check that makes the leaderboard honest: run the
  # IDENTICAL procedure on randomly-relabelled participants. If the real data
  # yields as many "supported" names as shuffled data, there is no skill here —
  # only variance. That comparison is the headline, not the leaderboard.
  null_calibration: permute_participant_within_date
  null_calibration_draws: 1000

room_2b:
  # REVISED 2026-08-16. The full crossed grid was 54,000 cells against 77,471
  # events — 1.43 events per cell. Even under perfectly even spreading only 4.8%
  # would clear the 30-event floor, and events cluster heavily in liquid large
  # caps and recent years. Every 10x slice has MDE 4.89%/mo against a plausible
  # bound of 0.50%: ten times too weak. The grid was finer than the data.
  #
  # Replaced by SIX pre-declared slices, each with a mechanism behind it rather
  # than being a cell in a crossed product. Six real claims beat 54,000 shrugs.
  slices:
    - id: side
      values: [buy, sell]
      mechanism: "institutions buy for many reasons (inflows, index tracking,
        rebalancing) but sell for fewer — selling may carry more information"
    - id: deal_type
      values: [bulk, block]
      mechanism: "blocks are 0.7% same-day round-trip vs 54.8% for bulk, so they
        are far less contaminated by market-maker churn"
    - id: liquidity_tier
      values: [top100, top500_ex100, off500]
      mechanism: "shorting feasibility and cost differ sharply by tier, and
        Finding 001 showed the effect was STRONGER in liquid names"
    - id: participant_category
      values: [MUTUAL_FUND, FPI_OFFSHORE, INSURANCE_BANK_PENSION, OTHER]
      mechanism: "genuine long-horizon institutions vs intermediaries; PROP_HFT
        already excluded upstream"
    - id: regime
      values: [calm, stressed]
      mechanism: "India VIX vs its 252-session median — information may be
        priced differently under stress"
    - id: deal_size
      values: [q1_smallest, q2, q3, q4_largest]
      mechanism: "deal value relative to ADV20 proxies conviction; a 0.5%
        threshold-scraper differs from a 5%-of-ADV position"
  # NOT crossed. Each slice is tested independently against the full sample, so
  # the family is 6 x n_horizons, not a product of every dimension.
  crossed: false
  correction: romano_wolf
  report_underpowered_explicitly: true

# ==============================================================================
# PORTFOLIO GATE — added 2026-08-16 because the plan could not answer "is it
# tradable" without it.
# ==============================================================================
# Finding 001 is why this exists. Its event effect was -0.805% over 10 sessions
# against volatility-matched peers at t -3.93, having survived a random-stock
# control and a volatility control. Its PORTFOLIO effect was -0.022%/yr at
# t -0.25 — nothing — because the filter only touched 1.2% of names.
#
# Every statistic in the event study was correct and pointed the right way. Only
# constructing the actual book revealed it was useless. AN EVENT STUDY IS NOT A
# STRATEGY TEST.
#
# Under the original plan, portfolio construction sat in Room 5 which was out of
# scope, so nothing could ever legitimately pass into Room 5 — the gates were
# event-study gates that say nothing about tradability. exp_001 would have been
# recorded as a PASS and shipped as a finding.
portfolio_gate:
  required_for_every_study: true
  # Both gates must pass. Clearing the event gate alone is not a result.
  gates:
    event_gate: "abnormal return significant vs the matched control, after
      correction, with MDE below the plausible bound"
    portfolio_gate: "a constructed book applying the signal beats the identical
      book without it, net of real costs on the INCREMENTAL turnover, with a
      paired block-bootstrap CI excluding zero"
  construction:
    universe: top500_pit
    weighting: equal            # no optimiser — an optimiser is a second signal
    rebalance: month_end
    paired_difference: true     # same book with/without, so beta and style cancel
    min_names: 30
    cost_basis: incremental_turnover_only
  # Report the dilution factor explicitly. Finding 001's was 1.2%, and that single
  # number explained the entire gap between t -3.93 and t -0.25.
  report_fraction_of_book_affected: true

seasonality:
  windows: [1, 2, 3, 5, 7, 10, 14, 20, 30, 45, 60, 75, 90]
  alignments:
    - TRADING_DAY_OF_YEAR
    - CALENDAR_DATE
    - TRADING_DAY_OF_MONTH_START
    - TRADING_DAY_OF_MONTH_END
  bases: [PRICE, MARKET_RELATIVE]
  min_obs_yearly_alignment: 10       # raised from the plan's 5
  min_obs_monthly_alignment: 30
  permutation_rotations: 1000        # 300 for iteration
  near_duplicate:
    group_by_adjacency: true
    return_correlation_threshold: 0.90
  index_expansion:
    target_count: 202
    require_dedup: true
    require_history_eligibility: true
  # Never hard-code the cell count. The prior atlas held 31,893,556; the run
  # records its own n_tests_in_run and a test greps for the literal.
  record_actual_test_count: true
  # OWNER DECISION 2026-08-16, reaffirmed against my recommendation: FULL rebuild
  # of all cells with new code, ~3 weeks, rather than validating the existing
  # atlas in ~1 week. My objection was that this re-derives a known answer (ratio
  # 1.05 vs chance, best pattern at the 94th percentile of rotated noise). The
  # owner's call stands; the gain is independent confirmation and clean provenance
  # through the DAG rather than trusting the predecessor's output.
  # REVISED 2026-08-18 — owner reversed decision 0006. See decision 0026.
  #
  # 0006 chose a FULL 31.9M-cell rescan (~3 weeks) against my recommendation to
  # validate the predecessor's atlas instead. The schedule rewrite (PLAN_3 §3)
  # then measured only 1.7 weeks of slack against the 2027-02-28 deadline, and
  # this was the single largest cut available.
  #
  # The case is stronger now than when 0006 was made:
  #   - the predecessor ALREADY ran this scan; its own verdict was that the best
  #     pattern sits at the 94th percentile of rotated noise
  #   - the corrected fee schedule then killed both surviving effects
  #     (turn-of-month +3.70 -> -6.36 bps net)
  #   - so a rebuild spends 2 weeks re-deriving a known negative
  #
  # WHAT VALIDATION STILL MUST DO. This is NOT "trust the old numbers".
  # Independently recompute a sample of cells with new code and require an exact
  # match, then apply the CURRENT machinery — measured null, Track S folds,
  # simulated bar — to the atlas as data. A sample mismatch escalates to a full
  # rebuild automatically.
  rebuild_mode: validate_existing_atlas
  rebuild_estimated_weeks: 1
  validation:
    sample_cells: 100000            # ~0.3% of 31,893,556, recomputed from scratch
    match_tolerance: 0.0            # exact — these are deterministic counts
    on_mismatch: escalate_to_full_rescan
    # The atlas is INPUT DATA, not a result. Everything downstream is recomputed.
    treat_atlas_as: input_data_not_result
  superseded_decision: "0006 full_rescan, reversed by owner 2026-08-18 (see 0026)"

  chunked_resumable: true          # 31.9M cells needs checkpointing
  removed_from_consideration:
    # Owner decision Q43. And now supported by arithmetic: with the corrected fee
    # schedule, turn-of-month's +129.70 bps gross against 136.06 bps cost is
    # -6.36 bps net. It does not survive.
    - turn_of_month
    - turn_of_year

trial_counter:
  # SUPERSEDED 2026-08-18 by configs/trials.yml. See docs/decisions/0023.
  #
  # This section previously read "Applied to EVERYTHING including incumbents".
  # Taken literally — and there was no reason not to — running Track S once would
  # have pushed Track D's bar from |t| >= 3.71 to 7.28, retroactively failing
  # exp_001 and making every future deal study impossible. The rule intended to
  # enforce honesty would have destroyed the track it was protecting.
  #
  # The counter is now HIERARCHICAL. Track D charges TRACK_D_DEALS and nothing
  # else. A claim of the form "the project found X" faces the project-level bar
  # summed across every family. Both are reported, always.
  #
  # The "applies to incumbents" principle is RETAINED — it exists because the
  # predecessor deflated challengers while exempting its own champion — but it
  # now applies within each family and at project level, rather than as one
  # undifferentiated pool.
  superseded_by: configs/trials.yml
  family_for_this_track: TRACK_D_DEALS
  carried_from_predecessor: 68     # 47 factory + 21 v1 legacy
  applies_to_incumbents: true

# ==============================================================================
# PROJECT KILL CRITERION — owner decision 2026-08-17, docs/decisions/0010.
# ==============================================================================
# Studies could be killed; the PROJECT could not. MICCV2 ran roughly two years,
# recorded 22 KILLs and zero promotions, and never once concluded that the
# approach did not work. Without a project-level criterion a project can lose
# every battle and never concede the war.
project_kill_criterion:
  # Either condition fires. Whichever comes first.
  # REVISED 2026-08-18. This read "3 of 4 studies" — a rule that cannot evaluate
  # if the critical path runs ONE study, which is what the schedule rewrite in
  # PLAN_3 §3.2 makes it do. The threshold now applies to studies ACTUALLY RUN,
  # and the checkpoint becomes the primary trigger because it fires on the
  # critical path alone.
  fail_fraction_threshold: 0.75   # of studies actually run, failing their PORTFOLIO gate
  min_studies_before_fraction_applies: 2
  planned_studies: 4              # aspiration; the critical path guarantees 1
  primary_trigger: checkpoint
  deadline: "2027-02-28"        # no portfolio-gate PASS by this date
  checkpoint: "2026-11-30"      # honest mid-point written assessment
  checkpoint_rule: "if no study has reached even the EVENT gate by this date,
    abandon early rather than running out the clock"
  on_trigger: write_final_verdict
  verdict_path: docs/reports/FINAL_VERDICT.md
  verdict_must_state: "plainly, that public institutional deal disclosure does not
    contain a tradable edge — a negative result stated clearly is the deliverable"
  # Only a dated written amendment by the owner moves these. Not a good week of
  # results near the deadline: a deadline's entire value is being inconvenient
  # when it arrives.
  amendable_only_by: owner_written_decision_record

# The exploration/selection/confirmation partition lives in configs/split.yml.
# It is referenced, not restated, so there is exactly one source of truth for the
# ratios and the key rule. See docs/decisions/0008 and 0009.
split_spec: configs/split.yml
