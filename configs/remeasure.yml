# remeasure.yml — studies that cannot be asked yet, and when to measure again.
#
# Every registered question now has a verdict (0076). What remains open is not a
# question awaiting a run but a SERIES awaiting its own length: the collector
# keeps these current, and each one's power is re-measured on a fixed date
# rather than whenever someone remembers. A dispersion-only power run is free
# under 0035; a registration is not, and happens only when one of these says
# the design has reached its bound.
#
# The daily digest lists each item from `warn_days` before `due` and every day
# after it until `last_done` is moved past the due date.
warn_days: 30
items:
  - id: insider_promoter_sell
    what: promoter insider sells, 12 months, market benchmark (best case 1.13x short)
    due: 2027-09-15
    last_done: 2026-09-29
    command: RESEARCH_ENV=prod .venv/bin/python -m src.research.insider_power
    report: docs/reports/INSIDER_POWER.md
    reaches_bound: ~148 twelve-month cohorts, about 2029 (INSIDER_POWER.md)
  - id: mf_holding_change
    what: exp_004 v3 clean pool (decision 0092), quarterly holding change, 63 sessions; on 2026-10-25 capped 1.47x short, uncapped 4.76x
    due: 2027-10-25
    last_done: 2026-10-25
    command: RESEARCH_ENV=prod .venv/bin/python -m src.research.holdings_power
    report: docs/reports/HOLDINGS_POWER_PRELIMINARY.md
    reaches_bound: capped at about 46 clean quarters, about 2032; uncapped not this decade; the A/B tail rule is chosen before any read
  - id: exp006_forward_health
    what: exp_006 forward test — complete blocks, names per block, candidates computable; NEVER an IC (draft §4, 0090)
    due: 2027-11-03
    last_done: 2026-10-11
    command: RESEARCH_ENV=prod .venv/bin/python -m src.scan.forward --health
    report: docs/plan/EXP006_FORWARD_RESIDUAL_DRAFT.md
    reaches_bound: the one read at 96 complete forward blocks, about 2034
  - id: pead_power
    what: post-earnings drift, top minus bottom SUE fifth, 63 sessions, CHAR_MATCHED (1.59x short on 2026-10-24, random fifths)
    due: 2027-04-24
    last_done: 2026-10-24
    command: RESEARCH_ENV=prod .venv/bin/python -m src.research.pead_power
    report: docs/reports/PEAD_POWER_PRELIMINARY.md
    reaches_bound: about 2.5x the SUE-eligible months at today's dispersion, roughly 2031; earlier results history would shorten it
  - id: mf_monthly_power
    what: mutual-fund holding change on MONTHLY scheme portfolios, 21 sessions (1.37x short on 2026-10-20, after PGIM/Trust/WhiteOak)
    due: 2027-10-15
    last_done: 2026-10-20
    command: RESEARCH_ENV=prod .venv/bin/python -m src.research.mf_monthly_power
    report: docs/reports/MF_MONTHLY_POWER_PRELIMINARY.md
    reaches_bound: ~160 monthly cohorts at today's dispersion, about 2029; wider recent coverage may shorten it
