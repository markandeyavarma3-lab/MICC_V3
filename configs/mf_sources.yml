# Fund houses whose monthly portfolio files src/archive/mf_portfolios.py fetches.
#
# Each source names the page that lists the files and how to pick them out.
# Measured 2026-10-10 by rendering every page AMFI links to
# (amfiindia.com/online-center/portfolio-disclosure).
#
#   page     the listing page, rendered in Chrome
#   match    regex a file URL (or its link text) must match
#   exclude  regex that drops a file (default: fortnightly, half-yearly, debt-only,
#            AAUM, factsheet, riskometer files)
#   mode     links (default) | api — api reads file paths out of the JSON the page
#            fetched, from responses whose URL matches `api`; relative paths are
#            joined to `base`
#   mode: template   a list API called once per month in the window; `template`
#            holds {year}, {month} (January..December), {mm} (01..12) and/or {m} (1..12);
#            with `post`, the body template, sent as JSON, or as a form post with `form: true`
#   clicks   text of tabs to click, in order, before the links are read
#   next, max_pages   a paginated list: the Next control's text, and how many pages to walk
#   timeout_s  a hard limit for the source (default 600 s); each source runs in its own process
#   undated  the URLs carry no month; each is fetched once and the file's own
#            title dates it
#
# NOT COVERED, and why (updated 2026-10-20) — see also the disabled entries below:
#   KOTAK, BANDHAN  refuse automated browsers (a Radware bot-check page; HTTP 403).
#                   A refusal, respected — not worked around.
#   AXIS, EDELWEISS, CANARA ROBECO  encrypt their API responses ('cipherText',
#                   'encryptedString'): deliberate protection, respected.
#   HSBC            does not answer plain or headless requests.
#   ZERODHA         publishes quarterly, not monthly; UNIFI's page stops at 2025-04.
#   MAHINDRA MANULIFE  encrypts its API payloads ('payload' ciphertext, 2026-10-20):
#                   deliberate protection, respected.
#   360 ONE         its downloads pages render no list to a headless browser (2026-10-20).
#   NAVI, BAJAJ     the monthly tab exposes no file links or list API (2026-10-20);
#                   not yet mapped, as are the smallest houses.

sources:
  - {amc: SBI, name: SBI Mutual Fund, page: "https://www.sbimf.com/portfolios",
     match: "all-schemes-monthly-portfolio"}
  - {amc: ICICI, name: ICICI Prudential Mutual Fund, mode: api, api: "downloads/files", wait_ms: 8000,
     page: "https://www.icicipruamc.com/news-and-media/downloads?currentTabFilter=Disclosures&&subCatTabFilter=MonthlyPortfolioDisclosures",
     base: "https://www.icicipruamc.com/blob", match: "Monthly-Portfolio-Disclosure"}
  - {amc: HDFC, name: HDFC Mutual Fund, page: "https://www.hdfcfund.com/statutory-disclosure/portfolio/monthly-portfolio",
     match: "/Monthly(%20|\\s|_)"}
  # 2026-10-15: UTI's page builds its list from a JSON API that plain HTTP may call.
  - {amc: UTI, name: UTI Mutual Fund, mode: template,
     page: "https://www.utimf.com/downloads/consolidate-all-portfolio-disclosure",
     template: "https://www.utimf.com/api/get-consolidate-portfolio-disclosure?year={year}&month={month}",
     match: "portfolio", exclude: "debt|fortnight|half"}
  # 2026-10-16: Quant lists files from an ASP.NET page method, one POST per year.
  - {amc: QUANT, name: quant Mutual Fund, mode: template,
     page: "https://quantmutual.com/statutory-disclosures",
     template: "https://quantmutual.com/statutorydisclosures.aspx/displaydisclouser",
     post: "{{id:'{year}',cat:'Monthly Portfolio'}}",
     base: "https://quantmutual.com", match: "portfolio", exclude: "fortnight|half|debt|aaum|factsheet|risk"}
  # 2026-10-16: LIC's consolidated list is a form post per (year, month number).
  - {amc: LIC, name: LIC Mutual Fund, mode: template, form: true,
     page: "https://www.licmf.com/downloads/monthly-portfolio",
     template: "https://www.licmf.com/downloads/consolidated-portfolio-files",
     post: "id=639&month={m}&year={year}",
     base: "https://www.licmf.com", match: "portfolio"}
  # 2026-10-16: Sundaram lists every monthly file from an AjaxPro handler;
  # file names carry the upload time, not the month, so each is dated by its title.
  - {amc: SUNDARAM, name: Sundaram Mutual Fund, mode: template, undated: true,
     page: "https://www.sundarammutual.com/Monthly-Fortnightly-Adhoc-Portfolios",
     template: "https://www.sundarammutual.com/ajax/Modules_Disclosure_Monthly_Fortnightly_Adhoc_Portfolios,App_Web_vg2r0dba.ashx?_method=GetCategory&_session=no",
     post: "Catid=Monthly", content_type: "text/plain; charset=utf-8",
     base: "https://www.sundarammutual.com", match: "monthlyportfolio"}
  # 2026-10-20: PGIM's disclosure API returns the whole Monthly Portfolio section
  # in one POST: consolidated files 2015-04 .. 2021-06, per-scheme files from
  # 2024-04 (.xlsx and .xlsb; calamine reads both). Its own list skips 2021-07 .. 2024-03.
  - {amc: PGIM, name: PGIM India Mutual Fund, mode: template,
     page: "https://www.pgimindia.com/mutual-funds/disclosures",
     template: "https://www.pgimindia.com/api/v1/brochure/published/disclosure",
     post: "{{\"headerId\":2,\"sectionId\":\"SECTION_747960037\",\"source\":\"W\",\"branchCode\":null}}",
     match: "brochure/about-us/image/"}
  # 2026-10-20: Trust lists every monthly file (from 2021-02) in one POST; file
  # names carry the upload time, not the month, so each is dated by its title.
  - {amc: TRUST, name: TRUST Mutual Fund, mode: template, undated: true,
     page: "https://www.trustmf.com/disclosures",
     template: "https://www.trustmf.com/api/api/Trust/GetData",
     post: "{{\"systemQueryFileName\":\"disclosuresweb.xml\",\"tagName\":\"GetDisclosureByType\",\"searchField\":\"\",\"searchValue\":\"\",\"sortField\":\"uploaddate\",\"sortDirection\":\"DESC\",\"replaceField\":\"_slug_\",\"replaceValue\":\"portfolio-monthly-disclosure\"}}",
     match: "trustmf\\.com/Content/"}
  # 2026-10-20: WhiteOak's portfolio page reads a CMS list API, 100 records a
  # page (732 monthly per-scheme files); files are named by scheme and a hash,
  # so each is dated by its title. Raise `pages` as the list grows.
  - {amc: WHITEOAK, name: WhiteOak Capital Mutual Fund, mode: template, undated: true, pages: 10,
     page: "https://mf.whiteoakamc.com/regulatory-disclosures/scheme-portfolios",
     template: "https://cms.whiteoakamc.com/api/scheme-portfolios?pagination%5Bpage%5D={page}&pagination%5BpageSize%5D=100&sort%5B0%5D=published_date:desc&sort%5B1%5D=id:desc&populate=*&filters%5Bperiod%5D%5B$eq%5D=monthly",
     match: "content\\.whiteoakamc\\.com/"}
  - {amc: ANGELONE, name: Angel One Mutual Fund, page: "https://www.angelonemf.com/downloads",
     match: "Monthly-Portfolio"}
  - {amc: CAPITALMIND, name: Capitalmind Mutual Fund, page: "https://capitalmindmf.com/statutory-disclosures.html",
     match: "Monthly_Portfolio"}
  - {amc: NIPPON, name: Nippon India Mutual Fund, page: "https://mf.nipponindiaim.com/investor-service/downloads/factsheet-portfolio-and-other-disclosures",
     match: "NIMF-MONTHLY-PORTFOLIO", exclude: "fortnight|half|aaum|risk"}
  - {amc: ABSL, name: Aditya Birla Sun Life Mutual Fund, page: "https://mutualfund.adityabirlacapital.com/forms-and-downloads/portfolio",
     match: "/monthly-portfolio/"}
  - {amc: TATA, name: Tata Mutual Fund, page: "https://www.tatamutualfund.com/schemes-related/portfolio",
     match: "Monthly(%20|\\s)Portfolio"}
  - {amc: MIRAE, name: Mirae Asset Mutual Fund, page: "https://www.miraeassetmf.co.in/downloads/portfolio",
     match: "/portfolios/", next: "^\\s*(next|›|»|>)\\s*$", max_pages: 15}
  - {amc: DSP, name: DSP Mutual Fund, page: "https://www.dspim.com/mandatory-disclosures/portfolio-disclosures",
     match: "monthend-portfolio"}
  - {amc: PPFAS, name: PPFAS Mutual Fund, page: "https://amc.ppfas.com/downloads/portfolio-disclosure/",
     match: "monthly[-_]portfolio"}
  - {amc: MOTILAL, name: Motilal Oswal Mutual Fund, page: "https://www.motilaloswalmf.com/downloads/scheme-portfolio-details",
     match: "month-end-portfolio"}
  - {amc: INVESCO, name: Invesco Mutual Fund, page: "https://invescomutualfund.com/literature-and-form?tab=Complete",
     match: "completes-monthly-holding", undated: true}
  # Disabled 2026-10-10: the library page lists only 2018-2020 portfolios.
  - {amc: HSBC, name: HSBC Mutual Fund, disabled: true, page: "https://www.assetmanagement.hsbc.co.in/en/mutual-funds/investor-resources/information-library#&accordion1446811090=1",
     timeout_s: 240, match: "monthly", exclude: "closed-matured|fortnight|half|aaum|factsheet|risk"}
  # Re-enabled 2026-10-15: the JSON's literatureHref downloads from /download + the path.
  - {amc: FRANKLIN, name: Franklin Templeton Mutual Fund, mode: api, api: "literature",
     page: "https://www.franklintempletonindia.com/investor/reports?firstFilter-5",
     base: "https://www.franklintempletonindia.com/download", match: "monthly-portfolio"}
  - {amc: BARODA, name: Baroda BNP Paribas Mutual Fund, page: "https://www.barodabnpparibasmf.in/downloads/monthly-portfolio-scheme",
     match: "Monthly_Portfolio"}
  # Disabled 2026-10-10: the page lists only 2022 portfolios.
  - {amc: UNION, name: Union Mutual Fund, disabled: true, page: "https://www.unionmf.com/about-us/downloads/monthly-portfolio",
     match: "month-portfolios"}
  - {amc: JM, name: JM Financial Mutual Fund, page: "https://www.jmfinancialmf.com/downloads/Portfolio-Disclosure",
     match: "Monthly(%20|\\s)Portfolio"}
  - {amc: GROWW, name: Groww Mutual Fund, page: "https://growwmf.in/statutory-disclosure/portfolio",
     match: "Monthly(%20|\\s)Portfolio"}
  - {amc: HELIOS, name: Helios Mutual Fund, page: "https://www.heliosmf.in/portfolio-disclosure/",
     match: "Monthly-Portfolio"}
  - {amc: SAMCO, name: Samco Mutual Fund, page: "https://www.samcomf.com/StatutoryDisclosure",
     match: "MONTHLY_PORTFOLIO"}
  - {amc: OLDBRIDGE, name: Old Bridge Mutual Fund, page: "https://oldbridgemf.com/statutory-disclosures.html",
     match: "Monthly_Portfolio"}
  - {amc: SHRIRAM, name: Shriram Mutual Fund, page: "https://www.shriramamc.in/investor-statutory-disclosures",
     match: "Monthly-Portfolio-Shriram", exclude: "half|aaum|risk|complaint"}
