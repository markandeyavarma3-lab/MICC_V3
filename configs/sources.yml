  - source_id: nse_block_deals
    session: 2026-09-09
    acknowledged: 2026-09-16
    reason: same as 2026-09-08 — identical empty file, ordinary zero-block day.
  - source_id: nse_block_deals
    session: 2026-09-10
    acknowledged: 2026-09-16
    reason: same as 2026-09-08 — identical empty file, ordinary zero-block day.
  - source_id: nse_block_deals
    session: 2026-09-15
    acknowledged: 2026-09-16
    reason: >-
      UNLIKE THE THREE ABOVE, THIS ONE IS NOT CONFIRMED EMPTY — stated plainly
      because the difference matters. The 2026-09-15 20:31 run and the 2026-09-16
      08:30 run both fetched block.csv and both got the file dated 2026-09-11
      (identical to the last STORED session before it), meaning NSE had not yet
