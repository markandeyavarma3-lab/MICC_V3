      #    the same warmup fii_dii_cash already does. NOT a login.
      - "https://www.nseindia.com/api/corporate-share-holdings-master?index=equities&symbol={SYMBOL}"
      # 2. the filing itself, on the static host, no cookies. This is where the
      #    promoter-group entity NAMES are (in-bse-shp:NameOfTheShareholder).
      - "https://nsearchives.nseindia.com/corporate/xbrl/SHP_{id}_{stamp}_WEB.xml"
    warmup_page: "https://www.nseindia.com/companies-listing/corporate-filings-shareholding-pattern"
    existing_rows: 0                 # 2 proof files archived under SHP/ and SHP_XBRL/; nothing parsed
    purpose: "Promoter-group entity names, for the point-in-time
      promoter_related_flag. No promoter list exists today."
    note: "Per-symbol, not a bulk file: ~2,000 symbols x 2s = ~1.1 h per full
      sweep; quarterly cadence makes that fine. Probe only, decision pending."

