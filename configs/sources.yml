# Owner plan §4.2 — deferred sources, each with a NAMED TRIGGER so "later" is a
# decision rather than a drift.
deferred:
  - id: fpi_trade_wise
    trigger: "any study reaches PASS and needs participant-level FPI attribution"
  - id: fpi_sector_wise
    trigger: "Room 2B's sector slice returns a non-UNDERPOWERED result"
  - id: quarterly_ownership
    trigger: "consensus study PASSes and needs holding-level confirmation"
  - id: mf_scheme_holdings
    trigger: "the mutual-fund participant category shows a supported effect"
  - id: fno_institutional_positioning
    trigger: "FII/DII cash history reaches 24 months, making Engine E researchable"
    status: FIRED                    # 2026-09-11, decision 0058
    fired_rationale: >-
      The 24-month condition was written before 0056 measured that the deals
      track bottoms out on month-sparsity for entity-level work — only 7
      participants reach 12 months of activity under the §6.3 specification.
      That makes participant-wise OI the best entity-attributable flow series in
      the warehouse rather than a nice-to-have behind another study, so the
      original condition is testing for something that no longer decides the
      question. Collection resumed; ANALYSIS still deferred until the deals
      verdict lands.
  - id: corporate_announcements
    trigger: "an event-study extension is registered; note the insider-cluster
      family was KILLED across 4 studies in the predecessor and is NOT newly promising"
  - id: kite_connect
    trigger: "the single-stock-futures short study is registered (needs the F&O
      instrument master and lot sizes for the ~210 SSF names), OR intraday
      resolution finer than daily high/low is required for excursions"
    assessed: "2026-08-17. Owner had already paid for access. Measured state: 2
      days of raw archive (2026-08-06, 2026-08-13, 3.0 MB), access token expired
      2026-08-14 07:30 IST. instruments.csv carries 114,225 rows across 10,027
      NSE and 12,763 BSE instruments and HAS NO ISIN COLUMN, so it does not close
      the 27% symbol-to-ISIN gap measured for the split.
      DECISIVE POINT: Kite does not serve bulk or block deals, which are the
      object of study. Every planned study runs without it. Recommendation was
      therefore NOT to pay a recurring fee at this time.
      MICCV2 holds ~970 lines of working read-only Kite code (auth/login/archive/
      indices) that ports in an afternoon if the trigger fires."

# =============================================================================
# ACKNOWLEDGED LOSSES
# =============================================================================
#
# Sessions this project asked for, did not get, and CANNOT EVER GET. The
# historical endpoint answers 503 (decisions 0024, 2.4/2.5 in PLAN_3 are graded
# IMPOSSIBLE for this reason), so the only copy that would ever have existed is
# the rolling current-day file that was missed at the time.
#
# WHY THIS LIST EXISTS AT ALL. Gap detection landed on 2026-09-03 and correctly
# found these three. It then alerted on them on every single run — three times a
# session, by email, for a condition that will never change and that nobody can
# act on. An alert that cannot be cleared is an alert that gets filtered, and
# this project already lost 2026-08-19 because a signal reached nothing.
#
# A gap listed here stays VISIBLE in HEALTH.md and stops paging. A gap NOT
# listed here still alerts, which is the whole point: acknowledging a loss is a
# deliberate act with a date and a reason attached, not a threshold that decays.
acknowledged_gaps:
  - source_id: nse_bulk_deals
    session: 2026-08-19
    acknowledged: 2026-09-05
    reason: >-
      cron fired but the launchd agent was not yet installed; noticed 2026-08-22
      and the endpoint had already rolled. Unrecoverable — /api/historical/
      bulk-deals answers 503 with and without a session cookie.
  - source_id: nse_bulk_deals
    session: 2026-08-27
    acknowledged: 2026-09-05
    reason: >-
      collector ran and the fetch was swallowed by the archive path bug fixed in
      src/ingest/parse.py; recovered by hand two days late, which was already
      past the rolling window.
  - source_id: nse_block_deals
    session: 2026-08-19
    acknowledged: 2026-09-05
    reason: same launchd gap as nse_bulk_deals on the same session.
  - source_id: fii_dii_cash
    session: 2026-08-19
    acknowledged: 2026-09-05
    reason: >-
      same launchd gap as the deal feeds on the same session. This one never
