[project]
name = "institutional-research"
version = "0.1.0"
description = "Research platform for disclosed institutional activity in Indian equities. Paper research only — no orders, no live trading."
requires-python = ">=3.14"
license = { text = "MIT" }

# PIN WHAT IS ACTUALLY TESTED.
#
# Corrected 2026-08-21. Every pin below had drifted from the environment the
# suite actually runs in — duckdb 1.4.1 pinned against 1.5.5 installed, pandas
# 2.3.3 against 3.0.5, and so on for all of them. A pin that does not describe
# the interpreter the tests passed on is not reproducibility, it is a claim of
# reproducibility, which is worse: it survives review and fails on a clean clone.
#
# `requests` was declared and NEVER IMPORTED anywhere in src/, tests/ or
# scripts/. src/archive/stopgap.py deliberately uses urllib from the standard
# library. Removed rather than installed — an unused dependency is a supply-chain
# surface and a false statement about what the project needs.
#
# duckdb and pyarrow are retained though nothing imports them yet: the Phase 1
# warehouse rebuild is written against DuckDB reading the parquet seed.
dependencies = [
    "duckdb==1.5.5",
    "pandas==3.0.5",
    "numpy==2.5.2",
    "pyarrow==25.0.1",
    "scipy==1.18.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# pytest-cov and ruff are pinned but NOT currently installed in .venv. Listed so
# a clean environment gets them; their absence is why no coverage number and no
# lint result appears anywhere in this project's reporting.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "ruff==0.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    # The four tiers from the owner plan §20, so CI can run them independently.
    "unit: pure logic — parsing, mapping, arithmetic, corrections, no I/O",
    "data: invariants over real data — no impossible prices, no trade before availability",
    "research: leakage and correctness of the research pipeline itself",
    "regression: pins a known quantity, e.g. the corrected-fee turn-of-month gate",
    # Orthogonal to the tiers.
    "needs_data: requires data/ and db/ to be populated",
    "slow: takes more than 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
