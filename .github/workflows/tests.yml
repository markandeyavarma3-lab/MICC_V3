# Step 1.2 — the last thing in Phase 1 that was not WIRED.
#
# It read BUILT from 2026-08-17 to 2026-09-01 with the note "CI has never run;
# .github/workflows absent". The scaffold existed and nothing executed it, which
# is exactly the BUILT-not-WIRED distinction status.py was written to expose —
# so leaving it unfixed while quoting that distinction was untenable.
#
# WHAT THIS CAN AND CANNOT RUN. `data/` and `db/` are gitignored, correctly, so
# a runner has no warehouse and no seed. Every test marked `needs_data` or
# `needs_spine` would fail on absence rather than on defect. So this runs the
# UNIT tier only — the parsers, the corrections, the arithmetic, the config
# bindings — which is the part that can be verified without 11 GB.
#
# The data-dependent tiers remain a local gate. That is a real limitation and is
# stated here rather than hidden behind a green badge.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml duckdb pandas numpy scipy
      - name: Unit tests
        env:
          RESEARCH_ENV: dev
        run: pytest tests -m unit -q
      - name: No order-placement code exists
        env:
          RESEARCH_ENV: dev
        run: pytest tests -k "order" -q
